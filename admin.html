<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h2>Admin - Add Post</h2></header>
  <main>
    <form id="postForm" class="form-box">
      <input type="text" id="title" placeholder="Post Title" required>
      <input type="number" id="likes" placeholder="Likes" required>
      <input type="number" id="relevance" placeholder="Relevance (10-100)" required>
      <input type="file" id="photo" accept="image/*">
      <button type="submit">Add Post</button>
    </form>
    <div class="btn-group">
      <button class="nav-btn" onclick="location.href='user.html'">View User Feed</button>
      <button class="nav-btn" onclick="location.href='index.html'">Close</button>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
